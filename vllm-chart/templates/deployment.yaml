apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama3-deployment
spec:
  replicas: {{.Values.replicaCount }}
  selector:
    matchLabels:
      app: vllm-llama3
  template:
    metadata:
      labels:
        app: vllm-llama3
    spec:
      containers:
      - name: vllm-server
        # IMPORTANT: Once we push the image to a registry (like ECR),
        # you would replace 'vllm-server:latest' with the full ECR path.
        # For now, this is a placeholder.
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 8000
        # --- THIS IS THE MOST IMPORTANT PART FOR AI ---
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # --- THIS IS THE SECOND MOST IMPORTANT PART ---
        # A readiness probe tells K8s when your application is TRULY ready.
        # The pod is running, but is the model loaded? This checks.
        readinessProbe:
          httpGet:
            path: /health # vLLM provides a health check endpoint
            port: 8000
          initialDelaySeconds: 60 # Give it time to start
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12 # Give it up to 2 minutes (12*10s) to download the model
